<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>手機貪食蛇遊戲</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none; /* 防止手機按壓時選取文字 */
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            background-color: #222;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 10px;
            min-height: 100vh;
        }
        h1 {
            margin: 5px 0;
            font-size: 24px;
        }
        #score-board {
            font-size: 18px;
            margin-bottom: 10px;
        }
        canvas {
            background-color: #000;
            border: 3px solid #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            max-width: 90vw;
            max-height: 40vh;
        }
        /* 手機按鍵控制區 */
        .controls {
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(2, 60px);
            gap: 10px;
        }
        .btn {
            background-color: #444;
            color: white;
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px #222;
            cursor: pointer;
        }
        .btn:active {
            background-color: #666;
            box-shadow: 0 2px #111;
            transform: translateY(2px);
        }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        
        #restart-btn {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>

    <h1>🐍 貪食蛇</h1>
    <div id="score-board">分數: <span id="score">0</span></div>
    
    <canvas id="gameCanvas" width="300" height="300"></canvas>
    <button id="restart-btn" onclick="resetGame()">重新開始</button>

    <!-- 手機螢幕虛擬按鍵 -->
    <div class="controls">
        <button class="btn btn-up" onclick="changeDirection('UP')">▲</button>
        <button class="btn btn-left" onclick="changeDirection('LEFT')">◀</button>
        <button class="btn btn-down" onclick="changeDirection('DOWN')">▼</button>
        <button class="btn btn-right" onclick="changeDirection('RIGHT')">▶</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const restartBtn = document.getElementById("restart-btn");

        const gridSize = 15;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameInterval;
        let gameStarted = false;

        function main() {
            if (isGameOver()) {
                alert(`遊戲結束！你的最終得分是: ${score}`);
                restartBtn.style.display = "block";
                return;
            }

            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();

            gameInterval = setTimeout(main, 120);
        }

        function clearCanvas() {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            ctx.fillStyle = "#4CAF50";
            snake.forEach((part, index) => {
                // 蛇頭顏色特別標示
                if (index === 0) ctx.fillStyle = "#8BC34A";
                else ctx.fillStyle = "#4CAF50";
                
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function moveSnake() {
            if (!gameStarted) return;
            
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            // 吃到食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            
            // 確保食物不會生在蛇身上
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    generateFood();
                }
            });
        }

        function drawFood() {
            ctx.fillStyle = "#FF5722";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function isGameOver() {
            if (!gameStarted) return false;

            // 撞牆判斷
            const hitLeft = snake[0].x < 0;
            const hitRight = snake[0].x >= tileCount;
            const hitTop = snake[0].y < 0;
            const hitBottom = snake[0].y >= tileCount;

            // 撞到自己判斷
            let hitSelf = false;
            for (let i = 1; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) {
                    hitSelf = true;
                }
            }

            return hitLeft || hitRight || hitTop || hitBottom || hitSelf;
        }

        function changeDirection(dir) {
            gameStarted = true;
            if (dir === 'LEFT' && dx !== 1) { dx = -1; dy = 0; }
            if (dir === 'UP' && dy !== 1) { dx = 0; dy = -1; }
            if (dir === 'RIGHT' && dx !== -1) { dx = 1; dy = 0; }
            if (dir === 'DOWN' && dy !== -1) { dx = 0; dy = 1; }
        }

        function resetGame() {
            snake = [{ x: 10, y: 10 }];
            food = { x: 5, y: 5 };
            dx = 0;
            dy = 0;
            score = 0;
            gameStarted = false;
            scoreElement.innerText = score;
            restartBtn.style.display = "none";
            clearTimeout(gameInterval);
            main();
        }

        // --- 手勢滑動支援 (Swipe Controls) ---
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, false);

        canvas.addEventListener('touchend', function(e) {
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            handleSwipe(touchStartX, touchStartY, touchEndX, touchEndY);
        }, false);

        function handleSwipe(startX, startY, endX, endY) {
            let diffX = endX - startX;
            let diffY = endY - startY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                // 水平滑動
                if (diffX > 30) changeDirection('RIGHT');
                else if (diffX < -30) changeDirection('LEFT');
            } else {
                // 垂直滑動
                if (diffY > 30) changeDirection('DOWN');
                else if (diffY < -30) changeDirection('UP');
            }
        }

        // 啟動遊戲
        main();
    </script>
</body>
</html>
